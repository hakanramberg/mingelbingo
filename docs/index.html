<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mingelbingo</title>
  <style>
    :root{--ink:#252345;--paper:#eef9fb;--coral:#1587a8;--yellow:#f4d45e;--mint:#b7e6c4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}main{width:min(720px,100%);margin:auto;padding:36px 16px 48px}.hero{text-align:center;padding:16px 12px 25px}.eyebrow{margin:0 0 8px;font-size:.68rem;font-weight:800;letter-spacing:.18em;color:#318064}h1{font-size:clamp(3.25rem,15vw,5.2rem);letter-spacing:-.075em;line-height:.83;margin:0;font-weight:900}h1 span{color:var(--coral);display:block}.intro{max-width:420px;margin:22px auto 0;font-size:1rem;line-height:1.45}.status{background:var(--ink);color:white;border-radius:17px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.86rem}.status strong{font-size:1.4rem;color:var(--yellow)}.bingo{color:var(--yellow);font-weight:800}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:18px 0 14px}.tile{min-width:0;aspect-ratio:1/1.12;padding:7px 5px;border:2px solid var(--ink);border-radius:11px;color:var(--ink);background:#fff;cursor:pointer;display:flex;flex-direction:column;text-align:left}.tile:active{transform:scale(.96)}.tile.found{background:var(--mint);border-color:#318064}.number{font-size:.62rem;font-weight:800;color:#1587a8}.prompt{margin:auto 0;font-size:clamp(.57rem,2.7vw,.82rem);line-height:1.13;font-weight:750;overflow-wrap:anywhere}.answer{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;border-top:1px solid #7cb89a;padding-top:4px;font-size:.61rem;font-weight:800;color:#26684f}.hint{text-align:center;font-size:.78rem;line-height:1.4;opacity:.75;margin:22px 0 13px}.reset{display:block;margin:auto;border:0;border-bottom:1px solid var(--ink);color:var(--ink);background:transparent;font-size:.8rem;padding:4px;cursor:pointer}.modal-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(37,35,69,.58);z-index:10}.name-modal{width:min(430px,100%);background:var(--paper);border-radius:20px;padding:26px;box-shadow:0 16px 45px rgba(0,0,0,.24)}.name-modal h2{font-size:2rem;line-height:1;margin:0}.name-modal p:not(.eyebrow){font-size:.94rem;line-height:1.35;margin:14px 0 22px}.name-modal label{display:block;font-size:.78rem;font-weight:800;margin-bottom:7px}.name-modal input{width:100%;border:2px solid var(--ink);border-radius:9px;background:#fff;padding:12px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}.modal-actions button{border:0;background:transparent;font:inherit;font-weight:800;cursor:pointer;padding:10px}.modal-actions .save{background:var(--yellow);border-radius:9px;color:var(--ink);padding:10px 15px}@media(min-width:580px){main{padding-top:50px}.board{gap:9px}.tile{padding:10px 8px}.number{font-size:.7rem}.answer{font-size:.7rem}}
  </style>
</head>
<body><main><section class="hero"><p class="eyebrow">KVÄLLENS UPPDRAG</p><h1>Mingel<span>bingo</span></h1><p class="intro">Gå runt, prata med nya människor och hitta personen bakom varje påstående.</p></section><section class="status"><div><strong id="count">0</strong><span> av 16 hittade</span></div><div id="bingo">Fyra i rad ger bingo</div></section><section id="board" class="board" aria-label="Bingobricka"></section><p class="hint">Tryck på en ruta när du hittat rätt person. Tryck igen för att ångra.</p><button class="reset" id="reset">Nollställ min bricka</button></main><div id="modal"></div><script>
const prompts=["Har bott och jobbat i Kina","Har coachat ett handbollslag till topp 6 i Ungdoms-SM","Har studerat i USA","Har dansat Bollywood-dans på bröllop i Indien","Har stort ölintresse och eget bryggeri","Har tävlat i Gladiatorerna","Är rankad topp 650 i världen i flipper","Joggade över 40 halvmaror under två år","Har ett starkt kärleksförhållande till tv-spel","Har tagit livet av sig i en teaterpjäs","Har hälsat på kungaparet","Tycker inte om att äta kyckling","Har rekord i antal pokaler för träningsflit i fotboll","Är fotbollstränare","Är ett stort fan av Kim Larsen","Har spelat i ett band som hette ”Lesbian Seagulls”"];
let state=JSON.parse(localStorage.getItem('mingelbingo-state')||'{"found":[],"names":{}}');const board=document.querySelector('#board'),modal=document.querySelector('#modal');function save(){localStorage.setItem('mingelbingo-state',JSON.stringify(state))}function lines(){const c=new Set(state.found),a=[...Array(4)].map((_,r)=>[0,1,2,3].map(x=>r*4+x)),b=[...Array(4)].map((_,c)=>[0,1,2,3].map(x=>x*4+c));return[...a,...b,[0,5,10,15],[3,6,9,12]].filter(l=>l.every(x=>c.has(x))).length}function render(){board.innerHTML='';prompts.forEach((p,i)=>{const f=state.found.includes(i),b=document.createElement('button');b.className='tile'+(f?' found':'');b.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span class="prompt">${p}</span>${f?`<span class="answer">${state.names[i]||'Hittad!'}</span>`:''}`;b.onclick=()=>f?(state.found=state.found.filter(x=>x!==i),save(),render()):ask(i);board.append(b)});document.querySelector('#count').textContent=state.found.length;const l=lines();document.querySelector('#bingo').textContent=l?`BINGO! ${l} rad${l>1?'er':''}`:'Fyra i rad ger bingo';document.querySelector('#bingo').className=l?'bingo':''}function ask(i){modal.innerHTML=`<div class="modal-backdrop"><form class="name-modal"><p class="eyebrow">SVAR PÅ RUTA ${String(i+1).padStart(2,'0')}</p><h2>Vem är det?</h2><p>${prompts[i]}</p><label for="name">Skriv personens namn</label><input id="name" autofocus placeholder="Till exempel: Anna"><div class="modal-actions"><button type="button" id="cancel">Avbryt</button><button class="save">Spara svar</button></div></form></div>`;document.querySelector('#name').focus();document.querySelector('#cancel').onclick=()=>modal.innerHTML='';modal.querySelector('form').onsubmit=e=>{e.preventDefault();const n=document.querySelector('#name').value.trim();if(!n)return;state.names[i]=n;state.found.push(i);save();modal.innerHTML='';render()}}document.querySelector('#reset').onclick=()=>{if(confirm('Vill du nollställa din bingobricka?')){state={found:[],names:{}};save();render()}};render();
</script></body></html>
