<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mingelbingo</title>
  <style>
    :root{--ink:#252345;--paper:#eef9fb;--coral:#1587a8;--yellow:#f4d45e;--mint:#b7e6c4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}main{width:min(760px,100%);margin:auto;padding:36px 16px 48px}.hero{text-align:center;padding:16px 12px 25px}.eyebrow{margin:0 0 8px;font-size:.68rem;font-weight:800;letter-spacing:.18em;color:#318064}h1{font-size:clamp(3.25rem,15vw,5.2rem);letter-spacing:-.075em;line-height:.83;margin:0;font-weight:900}h1 span{color:var(--coral);display:block}.intro{max-width:420px;margin:22px auto 0;font-size:1rem;line-height:1.45}.status{background:var(--ink);color:white;border-radius:17px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.86rem}.status strong{font-size:1.4rem;color:var(--yellow)}.bingo{color:var(--yellow);font-weight:800}.board{display:grid;gap:7px;margin:18px 0 14px}.tile{min-width:0;aspect-ratio:1/1.12;padding:7px 5px;border:2px solid var(--ink);border-radius:11px;color:var(--ink);background:#fff;cursor:pointer;display:flex;flex-direction:column;text-align:left}.tile:active{transform:scale(.96)}.tile.found{background:var(--mint);border-color:#318064}.number{font-size:.62rem;font-weight:800;color:#1587a8}.prompt{margin:auto 0;font-size:clamp(.57rem,2.7vw,.82rem);line-height:1.13;font-weight:750;overflow-wrap:anywhere}.answer{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;border-top:1px solid #7cb89a;padding-top:4px;font-size:.61rem;font-weight:800;color:#26684f}.hint{text-align:center;font-size:.78rem;line-height:1.4;opacity:.75;margin:22px 0 13px}.reset{display:block;margin:auto;border:0;border-bottom:1px solid var(--ink);color:var(--ink);background:transparent;font-size:.8rem;padding:4px;cursor:pointer}.notice{display:none;margin:12px 0 0;padding:10px 14px;border-radius:10px;background:#fff4c8;font-size:.78rem;text-align:center}.notice.show{display:block}.modal-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(37,35,69,.58);z-index:10}.name-modal{width:min(430px,100%);background:var(--paper);border-radius:20px;padding:26px;box-shadow:0 16px 45px rgba(0,0,0,.24)}.name-modal h2{font-size:2rem;line-height:1;margin:0}.name-modal p:not(.eyebrow){font-size:.94rem;line-height:1.35;margin:14px 0 22px}.name-modal label{display:block;font-size:.78rem;font-weight:800;margin-bottom:7px}.name-modal input{width:100%;border:2px solid var(--ink);border-radius:9px;background:#fff;padding:12px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}.modal-actions button{border:0;background:transparent;font:inherit;font-weight:800;cursor:pointer;padding:10px}.modal-actions .save{background:var(--yellow);border-radius:9px;color:var(--ink);padding:10px 15px}.loading{text-align:center;padding:42px 0;font-weight:800}.error{color:#a12b2b}@media(min-width:580px){main{padding-top:50px}.board{gap:9px}.tile{padding:10px 8px}.number{font-size:.7rem}.answer{font-size:.7rem}}
  </style>
</head>
<body><main><section class="hero"><p class="eyebrow">KVÄLLENS UPPDRAG</p><h1>Mingel<span>bingo</span></h1><p class="intro">Gå runt, prata med nya människor och hitta personen bakom varje påstående.</p></section><section class="status"><div><strong id="count">0</strong><span id="total"> av 0 hittade</span></div><div id="bingo">En hel rad ger bingo</div></section><div id="notice" class="notice">Påståendena har uppdaterats av arrangören.</div><section id="board" class="board" aria-label="Bingobricka"><p class="loading">Hämtar kvällens bricka...</p></section><p class="hint">Tryck på en ruta när du hittat rätt person. Tryck igen för att ändra namnet.</p><button class="reset" id="reset">Nollställ min bricka</button></main><div id="modal"></div>
<script>
let config={columns:4,revision:0,prompts:[]};let state=loadState();const board=document.querySelector('#board'),modal=document.querySelector('#modal');
function loadState(){try{const saved=JSON.parse(localStorage.getItem('mingelbingo-state')||'{}');if(saved.version===2)return saved;const found=(saved.found||[]).map(i=>Number(i)+1);const names={};Object.entries(saved.names||{}).forEach(([i,n])=>names[Number(i)+1]=n);return{version:2,found,names}}catch{return{version:2,found:[],names:{}}}}
function save(){localStorage.setItem('mingelbingo-state',JSON.stringify(state))}
function completedLines(){const found=new Set(state.found),ids=config.prompts.map(p=>p.id),rows=[];for(let i=0;i<ids.length;i+=config.columns){const row=ids.slice(i,i+config.columns);if(row.length===config.columns)rows.push(row)}for(let c=0;c<config.columns;c++){const col=[];for(let r=c;r<ids.length;r+=config.columns)col.push(ids[r]);if(col.length>1)rows.push(col)}if(ids.length===config.columns*config.columns){rows.push(ids.filter((_,i)=>i%(config.columns+1)===0));rows.push(ids.filter((_,i)=>i>0&&i%(config.columns-1)===0).slice(0,config.columns))}return rows.filter(line=>line.every(id=>found.has(id))).length}
function render(){board.innerHTML='';board.style.gridTemplateColumns=`repeat(${config.columns},minmax(0,1fr))`;config.prompts.forEach((p,i)=>{const f=state.found.includes(p.id),button=document.createElement('button');button.className='tile'+(f?' found':'');button.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span class="prompt"></span>${f?'<span class="answer"></span>':''}`;button.querySelector('.prompt').textContent=p.statement;if(f)button.querySelector('.answer').textContent=state.names[p.id]||'Hittad!';button.onclick=()=>ask(p,i);board.append(button)});document.querySelector('#count').textContent=state.found.filter(id=>config.prompts.some(p=>p.id===id)).length;document.querySelector('#total').textContent=` av ${config.prompts.length} hittade`;const lines=completedLines();const status=document.querySelector('#bingo');status.textContent=lines?`BINGO! ${lines} rad${lines>1?'er':''}`:`${config.columns} i rad ger bingo`;status.className=lines?'bingo':''}
function ask(prompt,index){const old=state.names[prompt.id]||'';modal.innerHTML=`<div class="modal-backdrop"><form class="name-modal"><p class="eyebrow">SVAR PÅ RUTA ${String(index+1).padStart(2,'0')}</p><h2>Vem är det?</h2><p id="modal-prompt"></p><label for="name">Skriv personens namn</label><input id="name" autocomplete="off" placeholder="Till exempel: Anna"><div class="modal-actions"><button type="button" id="cancel">Avbryt</button><button class="save">Spara svar</button></div></form></div>`;document.querySelector('#modal-prompt').textContent=prompt.statement;const input=document.querySelector('#name');input.value=old;input.focus();document.querySelector('#cancel').onclick=()=>modal.innerHTML='';modal.querySelector('form').onsubmit=e=>{e.preventDefault();const name=input.value.trim();if(!name)return;state.names[prompt.id]=name;if(!state.found.includes(prompt.id))state.found.push(prompt.id);save();modal.innerHTML='';render()}}
async function refresh(silent=false){try{const response=await fetch('/api/config',{cache:'no-store'});if(!response.ok)throw new Error();const next=await response.json();const changed=config.revision&&next.revision!==config.revision;config=next;if(changed)document.querySelector('#notice').classList.add('show');render()}catch{if(!silent)board.innerHTML='<p class="loading error">Kunde inte hämta kvällens bricka. Försök igen om en stund.</p>'}}
document.querySelector('#reset').onclick=()=>{if(confirm('Vill du nollställa din bingobricka?')){state={version:2,found:[],names:{}};save();render()}};refresh();setInterval(()=>refresh(true),30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true)});
</script></body></html>
