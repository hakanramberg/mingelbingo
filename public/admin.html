<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin | Mingelbingo</title>
  <style>
    :root{--ink:#252345;--paper:#eef9fb;--blue:#1587a8;--yellow:#f4d45e;--red:#b23a48;--green:#318064}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(900px,100%);margin:auto;padding:32px 16px 80px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}.eyebrow{margin:0 0 7px;font-size:.68rem;font-weight:800;letter-spacing:.18em;color:var(--green)}h1{font-size:clamp(2.5rem,8vw,4.4rem);letter-spacing:-.06em;line-height:.9;margin:0}h1 span{color:var(--blue)}.logout{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:5px;cursor:pointer}.panel{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:5px 5px 0 var(--ink)}.summary{display:flex;flex-wrap:wrap;align-items:end;gap:18px;margin-bottom:20px}.summary strong{display:block;font-size:2rem;color:var(--blue)}label{font-size:.76rem;font-weight:800}.columns label{display:block;margin-bottom:6px}.columns select,input{border:2px solid var(--ink);border-radius:9px;background:white;padding:10px;font:inherit}.columns select{min-width:130px}.prompt-list{display:grid;gap:10px}.prompt-row{display:grid;grid-template-columns:32px minmax(0,1.8fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border-radius:12px;background:var(--paper)}.order{font-size:.72rem;font-weight:900;color:var(--blue);text-align:center}.field label{display:block;margin:0 0 4px 2px}.field input{width:100%}.row-actions{display:flex;gap:4px}.icon{width:34px;height:34px;border:1px solid var(--ink);border-radius:7px;background:#fff;cursor:pointer;font-weight:900}.delete{color:var(--red)}.actions{position:sticky;bottom:12px;display:flex;justify-content:space-between;gap:12px;margin-top:18px;padding:12px;background:rgba(238,249,251,.94);border-radius:14px}.button{border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);padding:11px 16px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}.message{min-height:24px;margin:14px 0 0;font-size:.86rem;font-weight:800}.success{color:var(--green)}.error{color:var(--red)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;border:2px solid var(--ink);border-radius:20px;padding:28px;box-shadow:7px 7px 0 var(--ink)}.login-card h1{font-size:3rem}.login-card p{line-height:1.4}.login-card input{width:100%;margin:8px 0 12px}.login-card button{width:100%}.hidden{display:none}@media(max-width:650px){.prompt-row{grid-template-columns:28px 1fr auto}.field{grid-column:2/4}.field+.field{grid-column:2/4}.row-actions{grid-column:2/4}.top{align-items:start}.actions{flex-direction:column}.actions .button{width:100%}}
  </style>
</head>
<body><section id="login" class="login"><form class="login-card"><p class="eyebrow">MINGELBINGO ADMIN</p><h1>Logga <span>in</span></h1><p>Ange administratörslösenordet för att ändra kvällens bricka.</p><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required><button class="button primary">Öppna admin</button><p id="login-message" class="message error"></p></form></section>
<main id="admin" class="hidden"><header class="top"><div><p class="eyebrow">ADMINISTRATION</p><h1>Mingel<span>bingo</span></h1></div><button id="logout" class="logout">Logga ut</button></header><section class="panel"><div class="summary"><div><label>ANTAL PÅSTÅENDEN</label><strong id="count">0</strong></div><div class="columns"><label for="columns">Rutor per rad</label><select id="columns"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div></div><div id="prompt-list" class="prompt-list"></div><p id="message" class="message"></p></section><div class="actions"><button id="add" class="button">+ Lägg till påstående</button><button id="save" class="button primary">Spara och publicera</button></div></main>
<script>
const login=document.querySelector('#login'),admin=document.querySelector('#admin'),list=document.querySelector('#prompt-list'),message=document.querySelector('#message');let password=sessionStorage.getItem('mingelbingo-admin-password')||'';let config={columns:4,prompts:[]};
function headers(){return{'content-type':'application/json','x-admin-password':password}}
function showMessage(text,type=''){message.textContent=text;message.className='message '+type}
function rowTemplate(item,index){const row=document.createElement('div');row.className='prompt-row';row.innerHTML=`<div class="order">${String(index+1).padStart(2,'0')}</div><div class="field"><label>Påstående</label><input class="statement" maxlength="240" required></div><div class="field"><label>Rätt namn</label><input class="answer" maxlength="100" placeholder="Namn"></div><div class="row-actions"><button class="icon up" title="Flytta upp" aria-label="Flytta upp">↑</button><button class="icon down" title="Flytta ner" aria-label="Flytta ner">↓</button><button class="icon delete" title="Ta bort" aria-label="Ta bort">×</button></div>`;row.querySelector('.statement').value=item.statement||'';row.querySelector('.answer').value=item.answerName||'';row.querySelector('.up').onclick=()=>move(index,-1);row.querySelector('.down').onclick=()=>move(index,1);row.querySelector('.delete').onclick=()=>remove(index);return row}
function render(){list.innerHTML='';config.prompts.forEach((item,index)=>list.append(rowTemplate(item,index)));document.querySelector('#count').textContent=config.prompts.length;document.querySelector('#columns').value=String(config.columns)}
function readRows(){return[...list.querySelectorAll('.prompt-row')].map(row=>({statement:row.querySelector('.statement').value.trim(),answerName:row.querySelector('.answer').value.trim()}))}
function move(index,delta){config.prompts=readRows();const target=index+delta;if(target<0||target>=config.prompts.length)return;[config.prompts[index],config.prompts[target]]=[config.prompts[target],config.prompts[index]];render()}
function remove(index){config.prompts=readRows();if(config.prompts.length===1)return showMessage('Minst ett påstående måste finnas.','error');config.prompts.splice(index,1);render();showMessage('')}
async function load(){const response=await fetch('/api/admin/config',{headers:headers(),cache:'no-store'});if(!response.ok)throw new Error('Fel lösenord.');config=await response.json();login.classList.add('hidden');admin.classList.remove('hidden');render()}
login.querySelector('form').onsubmit=async e=>{e.preventDefault();password=document.querySelector('#password').value;document.querySelector('#login-message').textContent='';try{await load();sessionStorage.setItem('mingelbingo-admin-password',password)}catch(error){document.querySelector('#login-message').textContent=error.message}}
document.querySelector('#add').onclick=()=>{config.prompts=readRows();config.prompts.push({statement:'',answerName:''});render();list.lastElementChild.querySelector('.statement').focus()};
document.querySelector('#save').onclick=async()=>{config.prompts=readRows();config.columns=Number(document.querySelector('#columns').value);if(config.prompts.some(p=>!p.statement))return showMessage('Fyll i alla påståenden innan du sparar.','error');const button=document.querySelector('#save');button.disabled=true;showMessage('Sparar...');try{const response=await fetch('/api/admin/config',{method:'PUT',headers:headers(),body:JSON.stringify(config)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Kunde inte spara.');config=result;render();showMessage('Sparat. Deltagarnas brickor uppdateras automatiskt.','success')}catch(error){showMessage(error.message,'error')}finally{button.disabled=false}};
document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('mingelbingo-admin-password');location.reload()};if(password)load().catch(()=>sessionStorage.removeItem('mingelbingo-admin-password'));
</script></body></html>
